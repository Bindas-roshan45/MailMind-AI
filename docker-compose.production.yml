services:
  db:
    image: postgres:16-alpine
    container_name: mailmind_postgres
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-./backend/.env.${ENVIRONMENT:-production}}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mailmind_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-mailmind_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-mailmind_user} -d $${POSTGRES_DB:-mailmind_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      mailmind_network:
        aliases:
          - mailmind_postgres
          - db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mailmind_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${ENV_FILE:-./backend/.env.${ENVIRONMENT:-production}}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 4"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - mailmind_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: mailmind_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - mailmind_network

volumes:
  postgres_data:
    driver: local

networks:
  mailmind_network:
    driver: bridge
